name: Update PubMed bar charts

on:
  schedule:
    # 每天 UTC 19:00（是凌晨 3 点）
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-pubmed-bars:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser matplotlib

      - name: Generate yearly & monthly bar charts from PubMed RSS
        env:
          # 和你 README 里的 RSS 搜索保持一致，limit 建议大一点（比如 200）
          PUBMED_RSS_URL: "https://pubmed.ncbi.nlm.nih.gov/rss/search/1lyR11GsxK1bMA3jTm7Uhi20O_g2bcbLaEf-itlqG1dZLlVEGt/?limit=15&utm_campaign=pubmed-2&fc=20251114012738"
        run: |
          python .github/scripts/pubmed_bars.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 先把图片加入暂存区（包括第一次新建的情况）
          git add assets/pubmed_yearly_bar.png assets/pubmed_monthly_bar.png || true

          # 只根据已暂存内容判断是否有变化（包含新文件）
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update PubMed bar charts"
            git push
          fi
