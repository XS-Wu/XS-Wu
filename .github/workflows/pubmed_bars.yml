name: Update PubMed bar charts

on:
  schedule:
    # 每天 UTC 19:00（是凌晨 3 点）
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-pubmed-bars:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser matplotlib

      - name: Generate yearly & monthly bar charts from PubMed RSS
        env:
          # 和你 README 里的 RSS 搜索保持一致，limit 建议大一点（比如 100 或 200）
          PUBMED_RSS_URL: "https://pubmed.ncbi.nlm.nih.gov/rss/search/1TmjO1ifNewr3ZCXeKQ51L39DD88RQ2pLVl-AXtYCYAoQ3OQyZ/?limit=100&utm_campaign=pubmed-2&fc=20251114043805"
        run: |
          python .github/scripts/pubmed_bars.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 让当前 HEAD 绑定到本地 main 分支
          git checkout -B main

          # 把四张图加入暂存区（包括 Xinsheng Wu 版本）
          git add \
            assets/pubmed_yearly_bar.png \
            assets/pubmed_monthly_bar.png \
            assets/pubmed_yearly_bar_xw.png \
            assets/pubmed_monthly_bar_xw.png || true

          # 如果没有任何改动，就直接退出
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # 提交本次更新
          git commit -m "chore: update PubMed bar charts"

          # 拉取远端 main，并把这个提交 rebase 到最新的 main 上，避免 non-fast-forward
          git pull --rebase origin main

          # 推回远端
          git push origin main
