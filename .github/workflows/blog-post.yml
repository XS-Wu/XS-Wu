name: Update recent publications from PubMed

on:
  schedule:
    # 每天 UTC 19:00 执行一次（台北 +8 是凌晨 3 点）
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-with-pubmed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Update README with PubMed RSS
        uses: gautamkrishnar/blog-post-workflow@master
        with:
          feed_list: "https://pubmed.ncbi.nlm.nih.gov/rss/search/1lyR11GsxK1bMA3jTm7Uhi20O_g2bcbLaEf-itlqG1dZLlVEGt/?limit=15&utm_campaign=pubmed-2&fc=20251114012738"
          max_post_count: 5
          comment_tag_name: "BLOG-POST-LIST"
          # 只显示年份
          date_format: "yyyy"
          # 从 PubMed RSS 拿作者和期刊（dc:creator / dc:source）
          custom_tags: "authors/dc:creator/,journal/dc:source/"
          # 最终在 README 里的格式（单行、有项目符号）
          # 例：- **Title**. Author1, Author2, ..., et al. *Journal*. 2025. [PubMed](链接)
          template: "- **$title**. $authors. *$journal*. $date. [PubMed]($url)"
          # JS：清洗作者、最多保留前 5 个、>5 时加 “et al.”，并且把 Xinsheng Wu 加粗
          item_exec: |
            if (post.authors) {
              // 去掉多余空格和末尾的点号
              let txt = post.authors.replace(/\s+/g, ' ').trim();
              txt = txt.replace(/\.*\s*$/, '');

              // PubMed 作者一般是用逗号分隔，这里按逗号拆分
              let parts = txt.split(',').map(a => a.trim()).filter(Boolean);

              // 把 Xinsheng Wu 高亮成粗体
              parts = parts.map(a => a.includes('Xinsheng Wu') ? '**Xinsheng Wu**' : a);

              // 如果作者多于 5 个，只保留前 5 个 + et al.
              if (parts.length > 5) {
                parts = parts.slice(0, 5);
                parts.push('et al.');
              }

              post.authors = parts.join(', ');
            }
          commit_message: "chore: update recent publications from PubMed"
